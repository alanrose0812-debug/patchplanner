  <path d="M38 20 Q28 35 26 55 Q26 72 35 82 Q42 90 50 90 Q58 90 62 82 Q68 72 68 55 Q68 35 62 22 Q55 15 48 18 Q42 18 38 20 Z" fill="url(#beang)"/>
